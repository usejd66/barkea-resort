{% load static responsive %}
<section class="position-relative text-white overflow-hidden">
   <img src="{% static 'image/hero-villas.jpg' %}"{% responsive 'image/hero-villas.jpg' '100vw' %} alt="" width="5464" height="3640" fetchpriority="high" decoding="async" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover">
    <div class="position-absolute top-0 start-0 w-100 h-100 hero-overlay"></div>
    <div class="container position-relative py-5">
        <div class="py-5">
            <h1 class="display-4 fw-bold mb-2">{{ title }}</h1>
            <p class="lead mb-0 opacity-75">{{ subtitle }}</p>
        </div>
    </div>
</section>
