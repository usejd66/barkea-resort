{% if messages %}
<div class="site-toast-container" aria-label="Notifications">
    {% for message in messages %}
    <div class="toast site-toast{% if 'success' in message.tags %} site-toast-success{% elif 'warning' in message.tags %} site-toast-warning{% elif 'error' in message.tags %} site-toast-error{% else %} site-toast-info{% endif %}"
         role="{% if 'error' in message.tags %}alert{% else %}status{% endif %}"
         aria-live="{% if 'error' in message.tags %}assertive{% else %}polite{% endif %}"
         aria-atomic="true"
         data-bs-autohide="{% if 'success' in message.tags %}true{% else %}false{% endif %}"
         data-bs-delay="5000">
        <div class="d-flex align-items-center">
            <div class="toast-body d-flex align-items-center gap-2">
                {% if 'success' in message.tags %}
                <i class="bi bi-check-circle-fill site-toast-icon" aria-hidden="true"></i>
                {% elif 'warning' in message.tags %}
                <i class="bi bi-exclamation-triangle-fill site-toast-icon" aria-hidden="true"></i>
                {% elif 'error' in message.tags %}
                <i class="bi bi-exclamation-circle-fill site-toast-icon" aria-hidden="true"></i>
                {% else %}
                <i class="bi bi-info-circle-fill site-toast-icon" aria-hidden="true"></i>
                {% endif %}
                <span>{{ message }}</span>
            </div>
            <button type="button" class="btn-close me-2" data-bs-dismiss="toast" aria-label="Dismiss notification"></button>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
